name: Plugin bug
description: Report a problem with the Memory Sentry Spicetify Custom App (dashboard, settings, sidebar, or UI behavior).
title: "[Plugin] "
labels: ["bug", "plugin"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a plugin issue.

        Before you start:
        - Install Memory Sentry with the **official installer** from [GitHub Releases](https://github.com/yanlvl99/memory-sentry/releases). The Marketplace entry only links to this project and does not install it.
        - Search [existing issues](https://github.com/yanlvl99/memory-sentry/issues) first.
        - Attach logs as text or files; screenshots are welcome for visual issues.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I installed Memory Sentry with the official release installer.
          required: true
        - label: Spotify Desktop and Spicetify CLI are installed for the same Windows user.
          required: true
        - label: I searched existing issues and this is not a duplicate.
          required: true

  - type: input
    id: memory-sentry-version
    attributes:
      label: Memory Sentry version
      description: Shown in the dashboard or in the Setup filename.
      placeholder: e.g. 1.0.0-rc.2
    validations:
      required: true

  - type: input
    id: spotify-version
    attributes:
      label: Spotify version
      description: Spotify > Settings > About.
      placeholder: e.g. 1.2.60.564
    validations:
      required: true

  - type: input
    id: spicetify-version
    attributes:
      label: Spicetify CLI version
      description: Output of `spicetify -v`.
      placeholder: e.g. 2.40.0
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version and build
      description: Run `winver` and copy the version and build number.
      placeholder: e.g. Windows 11 24H2 (26100.2033)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the plugin problem.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the problem. For policy/settings issues, include the dashboard power state, automatic/manual mode, selected background delay, and Spotify window state.
      placeholder: |
        1. Open Spotify
        2. Select Memory Sentry in the sidebar
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs and error messages
      description: |
        Paste dashboard or browser-console errors. If relevant, add logs from
        `%LOCALAPPDATA%\SpicetifyMemorySentry\logs`: `setup.log` for setup/configuration
        failures, `startup.log` for launch failures, or `helper.log` for runtime events.
      render: text
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images or short videos that show the problem.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that may help, such as recent Spotify/Spicetify/Windows updates or changes.
    validations:
      required: false
