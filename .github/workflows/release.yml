name: Build and publish Memory Sentry
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/release.yml'
      - 'server/Cargo.toml'
      - 'server/Cargo.lock'
      - 'server/src/runtime.rs'
      - 'installer/wix/Product.wxs'
      - 'CHANGELOG.md'
      - 'scripts/build-package.ps1'
      - 'tests/validate-package.js'
      - 'app/index.js'
      - 'manifest.json'
      - 'README.md'
      - 'docs/**'
permissions:
  contents: write

jobs:
  build-release:
    if: "${{ startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'chore(release): publish v')) }}"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $cargo = Get-Content server/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Could not read Cargo version." }
          $version = $Matches[1]
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($tagVersion -ne $version) { throw "Release tag $tagVersion does not match Cargo version $version." }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag_name=v$version" >> $env:GITHUB_OUTPUT
      - name: Run Rust tests
        run: cargo test --manifest-path server/Cargo.toml --locked
      - name: Build Windows x64 server
        run: cargo build --release --manifest-path server/Cargo.toml --target x86_64-pc-windows-msvc --locked
      - name: Validate JavaScript and package metadata
        run: node tests/validate-package.js
      - name: Install WiX v5 and build the official MSIs (x64 + arm64)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          rustup target add aarch64-pc-windows-msvc
          .\scripts\build-package.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          body: |
            **Release candidate.** Do not treat this build as stable until the complete real-desktop Windows 10/11 audio, recovery, upgrade/uninstall, and restore-latency test matrix has passed. Marketplace is discovery only; the official per-user MSI is the sole supported installation method.
          prerelease: ${{ contains(steps.version.outputs.version, '-') || startsWith(steps.version.outputs.version, '0.') }}
          make_latest: ${{ !contains(steps.version.outputs.version, '-') && !startsWith(steps.version.outputs.version, '0.') }}
          files: |
            dist/MemorySentryForSpicetify-*.msi
            dist/MemorySentryForSpicetify-*.msi.sha256
