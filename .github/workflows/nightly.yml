name: Nightly build (develop)
on:
  schedule:
    # 06:00 UTC daily (03:00 in Sao Paulo). A rolling channel, not a release: it exists so the
    # current state of develop is installable for dogfooding every day with zero ceremony.
    # NOTE: schedule triggers only run from the DEFAULT branch; the workflow body checks out
    # the `develop` ref explicitly below, so the nightlies carry develop code even on main.
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write

jobs:
  build-nightly:
    runs-on: windows-latest
    steps:
      # Build the develop branch, not the default ref (main) the schedule fires from.
      - uses: actions/checkout@v4
        with:
          ref: develop
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Skip the nightly when one already exists today
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TAGS=$(gh release list --limit 200 --json tagName --jq '.[].tagName' || true)
          if printf '%s\n' "$TAGS" | grep -F "nightly-$TODAY" | grep -q .; then
            echo "A nightly for $TODAY already exists; the scheduled build is skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve the next tag for today
        if: steps.guard.outputs.exists != 'true'
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          TAGS=$(gh release list --limit 200 --json tagName --jq '.[].tagName' || true)
          N=$(printf '%s\n' "$TAGS" | grep -F "nightly-$TODAY." | sed 's/nightly-.*\.//' | sort -n | tail -1 || true)
          N=${N:-0}
          NEXT=$((N + 1))
          TAG="nightly-$TODAY.$NEXT"
          echo "Building $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Resolve the version from Cargo.toml
        id: ver
        if: steps.guard.outputs.exists != 'true'
        shell: pwsh
        run: |
          $cargo = Get-Content server/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Could not read Cargo version." }
          $version = $Matches[1]
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run Rust tests
        if: steps.guard.outputs.exists != 'true'
        run: cargo test --manifest-path server/Cargo.toml --workspace --locked
      - name: Validate JavaScript and package metadata
        if: steps.guard.outputs.exists != 'true'
        run: node tests/validate-package.js
      - name: Install WiX v5 and build the per-user MSIs (x64 + arm64)
        if: steps.guard.outputs.exists != 'true'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          rustup target add aarch64-pc-windows-msvc
          .\scripts\build-package.ps1 -Version "${{ steps.ver.outputs.version }}"
      - name: Create the dated nightly release
        if: steps.guard.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          NOTES="**Experimental nightly build.** Built automatically from the latest merges into \`develop\`. Untested on a real Windows desktop; may break Spotify. Install only if you want to dogfood Memory Sentry between official releases.

          $TAG"
          gh release create "$TAG" dist/MemorySentryForSpicetify-*.msi dist/MemorySentryForSpicetify-*.msi.sha256 \
            --prerelease \
            --title "Nightly build $TAG (unstable)" \
            --notes "$NOTES"
