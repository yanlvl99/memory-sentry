name: Validate Memory Sentry
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package and source syntax
        run: node tests/validate-package.js

  rust-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test platform-independent Rust policy
        run: cargo test --manifest-path server/Cargo.toml --locked

  windows-setup-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate JavaScript package
        run: node tests/validate-package.js
      - name: Run Rust tests on Windows
        run: cargo test --manifest-path server/Cargo.toml --locked
      - name: Build server for Windows x64
        run: cargo build --release --manifest-path server/Cargo.toml --target x86_64-pc-windows-msvc --locked
      - name: Verify safe binary commands
        shell: pwsh
        run: |
          $binary = Join-Path $env:GITHUB_WORKSPACE "server\target\x86_64-pc-windows-msvc\release\memory-sentry-server.exe"
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "The server version command failed." }
          & $binary --self-test
          if ($LASTEXITCODE -ne 0) { throw "The server self-test failed." }
      - name: Install WiX v5 and build the per-user MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:Path += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          $cargo = Get-Content server/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "Could not read Cargo version." }
          .\scripts\build-package.ps1 -Version $Matches[1]
      - name: Upload validation installer and package
        uses: actions/upload-artifact@v4
        with:
          name: MemorySentry-validation-build
          if-no-files-found: error
          path: |
            dist/MemorySentryForSpicetify-*.msi
            dist/MemorySentryForSpicetify-*.msi.sha256
